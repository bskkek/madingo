# Build an UNSIGNED iOS .ipa for Madingo on a free macOS runner.
#
# WEB-WRAPPER build: this is NOT the full offline app. The .ipa is a thin
# native shell (Madingo icon + WKWebView) that loads the LIVE site
# https://bskkek.github.io/madingo/ — always up to date, no bundled
# lessons. The local web bundle is dropped before the Xcode build, so the
# .ipa stays a few MB. It needs internet to open.
#
# Why this workflow creates the Capacitor project itself:
# - capacitor/ (the native Android/iOS shell) is LOCAL-ONLY and is not
#   committed to this repo, so a bare checkout has no ios/ platform.
# - capacitor/capacitor.config.json in this repo sets server.url to the
#   live site, so `cap init` merges it and the app loads the web app.
#
# What it does:
#   1. Checks out main and builds the web app with the Capacitor relative
#      base './' (CAPACITOR=1).
#   2. Creates the Capacitor iOS platform fresh (appId app.madingo.twa,
#      same as the Android build) and syncs.
#   3. Sets the Madingo app icon (public/icon-1024.png) — without this
#      the template ships the Capacitor logo.
#   4. Drops the local web bundle (the wrapper loads the live site).
#   5. Builds the app UNSIGNED (CODE_SIGNING_ALLOWED=NO), version 1.1
#      (build 2), and packages the .app into
#      Payload/Madingo-unsigned.ipa, uploaded as an artifact.
#
# The .ipa is UNSIGNED: it CANNOT be installed on an iPhone as-is. To
# install it, sideload it with AltStore/SideStore using a free Apple ID
# (free provisioning lasts 7 days). No Apple credentials are used or
# stored anywhere in this workflow.
#
# How to run: GitHub repo -> Actions -> "Build iOS (unsigned .ipa)" ->
# Run workflow. Download the artifact "Madingo-iOS-unsigned" when it
# finishes (about 10-15 minutes).
name: Build iOS (unsigned .ipa)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web app (Capacitor relative base './')
        run: bun run build
        env:
          CAPACITOR: '1'

      - name: Create Capacitor iOS platform
        run: |
          mkdir -p capacitor
          cd capacitor
          bun init -y
          bun add @capacitor/cli@6.2.3 @capacitor/core@6.2.3 @capacitor/ios@6.2.3
          bun add -d typescript@5
          bunx cap init Madingo app.madingo.twa --web-dir ../dist
          bunx cap add ios
          bunx cap sync ios

      - name: Set Madingo app icon
        run: |
          cp public/icon-1024.png capacitor/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

      - name: Drop local web bundle (wrapper loads live site)
        run: |
          rm -rf capacitor/ios/App/App/public
          mkdir -p capacitor/ios/App/App/public

      - name: Verify web wrapper bundle
        run: |
          # App must load the live site, not local files.
          grep -q 'bskkek.github.io/madingo' capacitor/ios/App/App/capacitor.config.json
          # Madingo icon in place (not the Capacitor default).
          cmp -s public/icon-1024.png capacitor/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          # No local web bundle shipped (wrapper must stay small).
          test "$(find capacitor/ios/App/App/public -type f | wc -l | tr -d ' ')" = "0"

      - name: Build unsigned .app with Xcode
        run: |
          cd capacitor
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=1.1 \
            CURRENT_PROJECT_VERSION=2
          test -d build/derived/Build/Products/Release-iphoneos/App.app

      - name: Package .app into unsigned .ipa
        run: |
          cd capacitor
          mkdir -p Payload
          cp -r build/derived/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Madingo-unsigned.ipa Payload
          ls -lh Madingo-unsigned.ipa

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Madingo-iOS-unsigned
          path: capacitor/Madingo-unsigned.ipa
          if-no-files-found: error
